<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광주·전남 AWS 기상관측망 관리</title>
<!-- 지도 라이브러리는 저장소 안에 두었습니다. 외부 접속이 막힌 곳에서도 지도가 뜹니다. -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* ===== 기본 설정 ===== */
:root{
  --navy:#0d2f5c;
  --blue:#1461a8;
  --blue-soft:#e9f1fa;
  --ink:#1b2733;
  --muted:#5d6b7a;
  --line:#dfe5ec;
  --bg:#f3f6f9;
  --card:#ffffff;
  --ok:#157f4b;      /* 정상 */
  --ok-bg:#e6f4ec;
  --soon:#9a6200;    /* 곧 도래 */
  --soon-bg:#fdf1dc;
  --due:#c03a19;     /* 점검필요 */
  --due-bg:#fbe9e4;
  --unknown:#5d6b7a;
  --unknown-bg:#eceff3;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:540px;margin:0 auto;background:var(--card);min-height:100vh;box-shadow:0 0 40px rgba(13,47,92,.08)}
section{padding:22px 18px;border-bottom:8px solid var(--bg)}
section:last-of-type{border-bottom:0}
h2{font-size:19px;margin:0 0 4px;letter-spacing:-.3px}
.sec-desc{font-size:14px;color:var(--muted);margin:0 0 16px}
button{font-family:inherit;font-size:inherit;cursor:pointer}

/* ===== ① 헤더 ===== */
header{
  background:linear-gradient(160deg,var(--navy),var(--blue));
  color:#fff;padding:26px 18px 24px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:46px;height:46px;border-radius:12px;flex:0 0 46px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;
}
.logo svg{width:26px;height:26px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.5px}
header p{margin:3px 0 0;font-size:13.5px;opacity:.88}

/* ===== 지상 / 해양 탭 ===== */
.tabs{
  display:flex;gap:8px;padding:14px 18px 0;max-width:540px;margin:0 auto;
}
.tab{
  flex:1;padding:11px 8px;border:1.5px solid var(--line);border-radius:11px;
  background:#fff;color:var(--muted);font-size:14.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;
}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* ===== 알림 배너 ===== */
.banner{
  display:none;margin:0;padding:12px 18px;background:#fff6e5;
  border-bottom:1px solid #f0dcb4;color:#7a5200;font-size:13.5px;line-height:1.5;
}
.banner.show{display:block}
.banner code{background:#f6ead0;padding:1px 5px;border-radius:4px;font-size:12.5px}

/* ===== ③ 지도 + 목록 ===== */
#map{height:330px;border-radius:var(--radius);border:1px solid var(--line);background:#e8eef3;overflow:hidden}
.map-fail{display:none;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;margin:14px 0 10px}
.search{
  flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:#fbfcfd;color:var(--ink);min-width:0;
}
.search:focus{outline:2px solid var(--blue);outline-offset:-1px;background:#fff}
.fitBtn{
  flex:0 0 auto;padding:0 13px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--blue);font-size:13.5px;font-weight:700;white-space:nowrap;
}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--muted);font-size:13.5px;font-weight:600;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* 목록 접기/펴기 */
.list-toggle{
  width:100%;display:flex;align-items:center;gap:8px;
  padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:15.5px;font-weight:700;color:var(--ink);text-align:left;
}
.list-toggle .cnt{color:var(--muted);font-weight:600;font-size:13.5px}
.list-toggle .caret{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .2s}
.list-toggle[aria-expanded="true"]{border-color:var(--blue);color:var(--blue)}
.list-toggle[aria-expanded="true"] .caret{transform:rotate(180deg);color:var(--blue)}
#listBox{margin-top:12px}
#listBox[hidden]{display:none}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.item{
  display:flex;align-items:flex-start;gap:11px;
  border:1px solid var(--line);border-radius:var(--radius);padding:13px 13px 13px 12px;background:#fff;
}
.item.picked{border-color:var(--blue);background:#f6faff;box-shadow:0 0 0 1px var(--blue) inset}
.item-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:inherit;font-size:inherit}
.item-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.35}
.item-name{font-size:16.5px;font-weight:700;letter-spacing:-.3px}
.item-id{font-size:12px;color:var(--muted);background:var(--bg);border-radius:5px;padding:1px 6px}
.item-addr{display:block;font-size:13.5px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-next{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.item-next b{color:var(--ink);font-weight:600}
.pick{
  flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
  background:#fff;color:var(--muted);font-size:12px;font-weight:700;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.pick[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.pick svg{width:16px;height:16px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

/* 상태 배지 */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap;
}
.badge svg{width:13px;height:13px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-soon{background:var(--soon-bg);color:var(--soon)}
.b-due{background:var(--due-bg);color:var(--due)}
.b-unknown{background:var(--unknown-bg);color:var(--unknown)}

/* 지도 핀 */
.pin{
  width:28px;height:28px;border-radius:50% 50% 50% 2px;transform:rotate(-45deg);
  border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
.pin span{transform:rotate(45deg);color:#fff;font-size:12px;font-weight:800;line-height:1}
.pin-ok{background:var(--ok)}
.pin-soon{background:var(--soon)}
.pin-due{background:var(--due)}
.pin-unknown{background:var(--unknown)}
/* 지도에 올라가는 핀 — 글씨 없이 색으로만 구분합니다 */
.pin-pick{background:var(--blue)}                 /* 출장지로 담은 장비 */
.pin-office{background:var(--navy)}               /* 사무실 */
.pin-port{background:#0f8a8a}                     /* 출항 항구 */
.pin-sel{                                         /* 지금 선택한 장비 */
  background:var(--navy);width:34px;height:34px;
  box-shadow:0 0 0 4px rgba(21,101,192,.28), 0 3px 8px rgba(0,0,0,.4);
}
.mascot-pin svg{display:block;filter:drop-shadow(0 2px 5px rgba(13,47,92,.4))}

/* 지도 한 켠에 붙어 상황을 알려주는 마스코트 */
.map-wrap{position:relative}
.map-mascot{
  position:absolute;right:10px;bottom:10px;
  pointer-events:none;filter:drop-shadow(0 3px 7px rgba(13,47,92,.35));
  transition:opacity .15s;z-index:450;
}
.map-mascot[hidden]{display:none}
.mascot-sprite{display:inline-block;overflow:hidden;flex:0 0 auto;line-height:0;vertical-align:middle}
.mascot-sprite img{display:block;max-width:none;height:auto}
/* img/ 스프라이트 — IMG_8808(2×2), IMG_8807(상단+하단) */
.mascot-s{
  display:inline-block;flex:0 0 auto;background-repeat:no-repeat;
  vertical-align:middle;
}
.mascot-s--fight,.mascot-s--good,.mascot-s--start,.mascot-s--doing{
  aspect-ratio:3/2;background-image:url('img/IMG_8808.png');background-size:200% 200%;
}
.mascot-s--fight {background-position:0% 0%}
.mascot-s--good  {background-position:100% 0%}
.mascot-s--start {background-position:0% 100%}
.mascot-s--doing {background-position:100% 100%}
.mascot-s--effort{
  aspect-ratio:3/1;background-image:url('img/IMG_8807.png');background-size:100% 200%;background-position:0% 0%;
}
.mascot-s--tired,.mascot-s--rest{
  aspect-ratio:3/2;background-image:url('img/IMG_8807.png');background-size:200% 200%;
}
.mascot-s--tired{background-position:0% 100%}
.mascot-s--rest {background-position:100% 100%}
.mascot-art{display:block;max-width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(13,47,92,.12));}
.route-intro .mascot-art,.route-mascot-row .mascot-art,.map-mascot .mascot-art{display:block}
.route-intro img{width:44px;height:auto;flex:0 0 auto}
.route-mascot-row img{width:50px;height:auto;flex:0 0 auto}

/* ===== ④ 경로 ===== */
.route-intro{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.route-intro span{font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
.route-mascot-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.route-mascot-row span{
  font-size:12.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);
  padding:6px 10px;border-radius:10px;line-height:1.4;
}
.route-rest-tip{
  display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;
  background:#eaf3fb;border:1px solid #cfe3f5;border-radius:10px;
}
.route-rest-tip img{width:38px;height:auto;flex:0 0 auto}
.route-rest-tip span{font-size:12.5px;color:#0d3b82;font-weight:600;line-height:1.45}
.route-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.route-from{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.route-from b{color:var(--ink)}
.picked-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;min-height:4px}
.tag{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 12px;font-size:13.5px;font-weight:600;
}
.tag button{border:0;background:#eef2f6;color:var(--muted);width:20px;height:20px;border-radius:50%;
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.btn{
  width:100%;padding:14px;border-radius:11px;border:0;background:var(--blue);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:-.3px;
}
.btn:disabled{background:#c3ccd6;color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.route-note{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}

.route-result{margin-top:14px;display:none}
.route-result.show{display:block}
.route-total{
  background:var(--navy);color:#fff;border-radius:11px;padding:13px 15px;
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;
}
.route-total{display:block;padding:14px 16px}
.route-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.route-sum + .route-sum{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.16)}
.route-sum span{font-size:13.5px;opacity:.85}
.route-sum b{font-size:22px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}
.route-total em{
  display:block;font-style:normal;font-size:11.5px;opacity:.62;
  margin-top:9px;line-height:1.45;
}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{
  content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line);
}
.step:last-child::before{display:none}
.step-no{
  flex:0 0 28px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:1;
}
.step-no.office{background:var(--navy)}
.step-body{flex:1;min-width:0;padding-top:2px}
.step-name{font-size:15.5px;font-weight:700}
.step-meta{font-size:12.5px;color:var(--muted);margin-top:1px}
/* 경로의 방문지 — 누르면 그 장비 현황이 열립니다 */
.step-link{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  background:none;border:0;padding:0;margin:0;font:inherit;color:var(--ink);
  text-align:left;cursor:pointer;
}
.step-link:hover .step-name,.step-link:focus-visible .step-name{text-decoration:underline}
.step-more{
  font-size:11.5px;font-weight:700;color:var(--blue);
  border:1px solid var(--blue);border-radius:999px;padding:1px 8px;
}
/* 구간 정보 — 출발지 → 도착지 · 거리 · 길안내 */
.leg{
  margin-top:7px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;
}
.leg-path{font-size:12.5px;color:var(--muted)}
.leg-path b{color:var(--blue)}
.leg-dist{font-size:12.5px;font-weight:700;color:var(--blue)}
.leg-dist.straight{color:var(--unknown)}
.leg-nav{
  margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;
  border:1.5px solid var(--blue);border-radius:999px;padding:3px 10px;
}
.leg-nav svg{width:13px;height:13px}
.leg-warn{flex-basis:100%;font-size:11.5px;color:var(--unknown)}
.route-loading{
  padding:14px;text-align:center;font-size:13.5px;color:var(--muted);
  border:1px dashed var(--line);border-radius:11px;background:#fff;
}
.route-warn{
  margin-bottom:10px;padding:10px 12px;border-radius:10px;line-height:1.5;
  background:var(--unknown-bg);color:var(--unknown);font-size:12.5px;
}

/* ===== 해양장비 ===== */
.empty-guide{
  border:1px dashed var(--line);border-radius:var(--radius);background:var(--bg);
  padding:20px 18px;font-size:13.5px;line-height:1.6;color:var(--muted);
}
.empty-guide b{display:block;color:var(--ink);font-size:15px;margin-bottom:8px}
.empty-guide p{margin:0 0 12px}
.empty-guide-mascot{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.empty-guide-mascot img{width:48px;height:auto;flex:0 0 auto}
.empty-guide-mascot span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.4}
.col-help{margin:0;padding-left:18px}
.col-help li{margin-bottom:3px}
.col-help code{font-size:12px}
.sea-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.sea-box .info{margin-bottom:12px}
.port-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin-top:12px;
}
.port-head{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.port-head b{font-size:15.5px}
.port-cnt{font-size:12.5px;color:var(--muted)}
.port-list{list-style:none;margin:10px 0 0;padding:0}
.port-list li{padding:9px 0;border-top:1px solid var(--line)}
.port-meta{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.port-foot{
  margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted);
}
.port-foot b{color:var(--ink)}

/* ===== ⑤ 파노라마 ===== */
.pano-pick{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.pano-pick b{color:var(--ink)}
.pano{
  position:relative;height:250px;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);background:#dfe5ea;
  background-repeat:repeat-x;cursor:grab;touch-action:pan-y;user-select:none;
}
.pano.dragging{cursor:grabbing}
.pano-hint{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  background:rgba(13,47,92,.78);color:#fff;font-size:12.5px;padding:6px 13px;border-radius:999px;
  pointer-events:none;white-space:nowrap;
}
.pano-empty{
  height:250px;border-radius:var(--radius);border:1.5px dashed #c5d0da;background:#fafcfd;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:20px;color:var(--muted);font-size:14px;gap:8px;
}
.pano-empty svg{width:36px;height:36px;opacity:.45}
.pano-empty b{color:var(--ink);font-size:15px}
.pano-spec{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}

/* ===== ⑥ 하단 ===== */
footer{background:var(--navy);color:#fff;padding:24px 18px 34px}
footer h3{margin:0 0 12px;font-size:15px;font-weight:700}
.foot-row{display:flex;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid rgba(255,255,255,.14)}
.foot-row:first-of-type{border-top:0}
.foot-row dt{flex:0 0 84px;opacity:.7;margin:0}
.foot-row dd{margin:0;flex:1}
.foot-note{margin:16px 0 0;font-size:12px;opacity:.6;line-height:1.6}

/* ===== 바텀시트 ===== */
.sheet-dim{
  position:fixed;inset:0;background:rgba(13,25,40,.45);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:1000;
}
.sheet-dim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:1001;
  max-width:540px;margin:0 auto;background:#fff;
  border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  max-height:86vh;overflow-y:auto;
}
.sheet.show{transform:translateY(0)}
.grip{width:40px;height:4px;border-radius:99px;background:#d5dbe2;margin:6px auto 14px}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.sheet-head h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px}
.sheet-addr{font-size:14px;color:var(--muted);margin:6px 0 16px}
.info{list-style:none;margin:0 0 16px;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.info li{display:flex;gap:10px;padding:11px 14px;font-size:14px;border-top:1px solid var(--line)}
.info li:first-child{border-top:0}
.info b{flex:0 0 96px;color:var(--muted);font-weight:500}
.info span{flex:1;font-weight:600}
.info .warn{color:var(--due)}
.sheet-btns{display:flex;gap:9px}
.sheet-btns .btn{flex:1;padding:14px 8px;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.sheet-btns svg{width:17px;height:17px}
.sheet-close{
  position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:50%;
  border:0;background:#eef2f6;color:var(--muted);font-size:17px;line-height:1;padding:0;
}

.loading{padding:60px 20px;text-align:center;color:var(--muted)}
@media (min-width:560px){ body{padding:0} }
</style>

/* ========================= 유틸 ========================= */
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  text = text.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else q=false; }
      else field+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=c;
    }
  }
  row.push(field); rows.push(row);
  const clean=rows.filter(r=>r.some(v=>v.trim()!==''));
  if(!clean.length) return [];
  const head=clean[0].map(h=>h.trim());
  return clean.slice(1).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]??'').trim()); return o;
  });
}

function parseDate(s){
  const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec((s||'').trim());
  if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3];
  const dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return dt;
}
function addMonths(date, n){
  const d=new Date(date.getTime());
  const day=d.getDate();
  d.setDate(1); d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  d.setDate(Math.min(day,last));
  return d;
}
function fmtDate(d){
  if(!d) return '-';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }

// 두 좌표 사이 직선거리(km) — 하버사인
function distKm(a,b){
  const R=6371, rad=Math.PI/180;
  const dLat=(b.lat-a.lat)*rad, dLon=(b.lon-a.lon)*rad;
  const s=Math.sin(dLat/2)**2 + Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function fmtKm(k){ return k<10 ? k.toFixed(1) : Math.round(k).toLocaleString('ko-KR'); }
// 분 → "1시간 5분" / "45분"
function fmtMin(m){
  if(m==null||!isFinite(m)) return null;
  const t=Math.round(m);
  if(t<60) return `${t}분`;
  const h=Math.floor(t/60), r=t%60;
  return r ? `${h}시간 ${r}분` : `${h}시간`;
}
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ========================= 상태 판정 ========================= */
function buildStation(raw){
  const lat=parseFloat(raw.lat), lon=parseFloat(raw.lon);
  const last=parseDate(raw.last_check);
  const cycle=parseInt(raw.cycle_months,10);
  const s={
    id: raw.station_id||'',
    name: raw.name||'(이름 없음)',
    lat, lon,
    address: raw.address||'',
    last, cycle: Number.isFinite(cycle)&&cycle>0 ? cycle : null,
    panorama: raw.panorama||'',
    note: raw.note||'',
    valid: Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180
  };
  if(last && s.cycle){
    s.next = addMonths(last, s.cycle);
    s.days = Math.round((s.next - today0())/86400000);
    s.status = s.days<0 ? STATUS.due : (s.days<=CONFIG.soonDays ? STATUS.soon : STATUS.ok);
  }else{
    s.next=null; s.days=null; s.status=STATUS.unknown;
  }
  return s;
}

/* 해양장비 한 줄을 화면에서 쓸 형태로 만듭니다.
   점검일·주기로 상태를 매기는 부분은 지상 장비와 같습니다. */
function buildMarine(raw){
  const s=buildStation(raw);
  const portLat=parseFloat(raw.port_lat), portLon=parseFloat(raw.port_lon);
  const boat=parseInt(raw.boat_min,10);
  const wave=parseFloat(raw.wave_limit);
  s.kind   = KIND[KIND_ALIAS[(raw.kind||'').trim()]] || KIND.etc;
  s.access = ACCESS[ACCESS_ALIAS[(raw.access||'').trim()]] || ACCESS.boat;
  s.seaArea= raw.sea_area||'';
  s.port   = raw.port||'';
  s.portPt = Number.isFinite(portLat)&&Number.isFinite(portLon)
             ? { name:s.port||'출항 항구', lat:portLat, lon:portLon, address:raw.port_address||'' } : null;
  s.boatMin= Number.isFinite(boat)&&boat>0 ? boat : null;
  s.wave   = Number.isFinite(wave)&&wave>0 ? wave : null;
  s.vendor = raw.vendor||'';
  s.vendorTel = raw.vendor_tel||'';
  s.photo  = raw.photo||'';
  /* 출항 계획에서 묶는 기준 —
     선박은 같은 항구끼리 한 번에 나가므로 항구로 묶고,
     육상 접근은 각자 다른 곳으로 차를 몰고 가므로 장비별로 따로 둡니다. */
  s.group      = s.access.key==='boat' ? `port:${s.port||'미지정'}` : `land:${s.id}`;
  s.groupLabel = s.access.key==='boat' ? (s.port||'출항 항구 미지정') : s.name;
  return s;
}

/* 담은 장비 중 가장 까다로운 파고 조건.
   업체가 점검하는 장비는 우리가 배를 띄우지 않으므로 셈에서 뺍니다. */
function updateWaveWorst(){
  const el=document.getElementById('waveWorst'); if(!el) return;
  const sail=state.picked.map(id=>state.marine.find(s=>s.id===id))
    .filter(s=>s && s.access.key==='boat');
  const waves=sail.map(s=>s.wave).filter(w=>w!=null);
  el.textContent = !sail.length ? '선박으로 나가는 장비 없음'
    : waves.length ? `${Math.min(...waves)}m 이하`
    : '자료 없음';
}

function badge(s){
  return `<span class="badge ${s.status.cls}">${ICON[s.status.key]}${s.status.label}</span>`;
}

function visible(){
  const q=state.query.trim().toLowerCase();
  if(!q) return [];               // 검색어를 입력하기 전에는 목록을 비워 둡니다.
  const marine=state.tab==='marine';
  return items().filter(s=>{
    if(state.filter!=='all' && s.status.key!==state.filter) return false;
    if(marine && state.kind!=='all' && s.kind.key!==state.kind) return false;
    // 해양은 '주소 검색' 자리를 해역·항구 검색으로 씁니다.
    const where = marine ? `${s.seaArea} ${s.port} ${s.address}` : s.address;
    const hay = state.mode==='addr' ? where
              : state.mode==='id'   ? s.id
              : (s.name+' '+where+' '+s.id);
    return String(hay).toLowerCase().includes(q);
  });
}

// 목록 접기/펴기

function renderList(){
  const ul=document.getElementById('list');

  document.getElementById('listCount').textContent = hasQuery ? `${rows.length}곳` : `전체 ${items().length}곳 · 검색 필요`;
  if(!rows.length){

    return;
  }
  ul.innerHTML = rows.map(s=>{

      : `<b style="color:var(--unknown)">점검 정보 확인 필요</b>`;
    // 해양은 주소 대신 종류·해역·접근 방식을 보여줍니다.
    const sub = state.tab==='marine'
      ? `${esc(s.kind.label)} · ${esc(s.access.label)}`
        + (s.seaArea?` · ${esc(s.seaArea)}`:'')
        + (s.port?` · 출항 ${esc(s.port)}`:'')
      : esc(s.address)||'주소 없음';
    return `<li class="item ${on?'picked':''}" data-id="${esc(s.id)}">
      <button class="item-main" data-act="open" data-id="${esc(s.id)}">
        <span class="item-top"><span class="item-name">${esc(s.name)}</span><span class="item-id">${esc(s.id)}</span>${badge(s)}</span>
        <span class="item-addr">${sub}</span>

      </button>
      <button class="pick" data-act="pick" data-id="${esc(s.id)}" aria-pressed="${on}"
        aria-label="${esc(s.name)} ${on?'경로에서 빼기':'경로에 담기'}" ${s.valid?'':'disabled'}>
        ${on?ICON.check:ICON.plus}<span style="font-size:9.5px">${on?'담김':'담기'}</span>
      </button>
    </li>`;
  }).join('');
}

/* ========================= 지도 ========================= */
function initMap(){
  const el=document.getElementById('map');
  if(typeof L==='undefined'){
    el.style.display='none';
    document.getElementById('mapFail').style.display='block';
    return;
  }
  // 탭을 바꾸면 이 함수가 다시 불립니다. 앞서 만든 지도를 확실히 정리해 둡니다.
  if(state.mapCleanup){ state.mapCleanup(); state.mapCleanup=null; }

  const pts=items().filter(s=>s.valid);
  const map=L.map(el,{scrollWheelZoom:false}).setView([36.4,127.9],6.4);
  state.map=map;
  L.tileLayer(CONFIG.tileUrl,{
    maxZoom:CONFIG.tileMaxZoom, attribution:CONFIG.tileAttribution
  }).addTo(state.map);

  // 핀은 처음에 하나도 두지 않습니다. 선택한 장비와 출장지만 syncMarkers가 올립니다.
  state.markerLayer=L.layerGroup().addTo(state.map);
  syncMarkers();

  // 컨테이너 크기가 확정된 뒤 '한 번만' 범위를 맞춥니다.
  // (fitBounds를 여러 번 겹쳐 부르면 타일 격자가 어긋나 지도 일부가 비어 보입니다)
  state.bounds = pts.length ? L.latLngBounds(pts.map(s=>[s.lat,s.lon])).pad(0.12) : null;
  const fitT=setTimeout(()=>{
    map.invalidateSize({animate:false});
    if(state.bounds) map.fitBounds(state.bounds,{animate:false});
  },80);

  // 화면 회전·크기 변경 대응 (연속 호출은 묶어서 한 번만)
  let rzT=null;
  const onResize=()=>{ clearTimeout(rzT); rzT=setTimeout(()=>map.invalidateSize({animate:false}),150); };
  const ro = window.ResizeObserver ? new ResizeObserver(onResize) : null;
  if(ro) ro.observe(el);
  window.addEventListener('orientationchange',onResize);

  state.mapCleanup=()=>{
    clearTimeout(fitT); clearTimeout(rzT);
    if(ro) ro.disconnect();
    window.removeEventListener('orientationchange',onResize);
    map.remove();
  };
}

/* 지도 핀을 다시 그립니다 — 선택한 장비 + 출장지로 담은 장비(+사무실)만 올립니다.
   핀에는 글씨를 넣지 않고, 이름은 눌렀을 때 말풍선으로 보여줍니다. */
/* 출장지(담은 장비)용 마스코트 핀 — 말풍선 모양 몸통에 웃는 얼굴을 넣습니다. */
function mascotPinHTML(size){
  const w=size, h=Math.round(size*1.32);
  return `<div class="mascot-pin" style="width:${w}px;height:${h}px">
    <svg width="${w}" height="${h}" viewBox="0 0 44 58" xmlns="http://www.w3.org/2000/svg">
      <path d="M22 3C11.507 3 3 11.507 3 22c0 15 19 32 19 32s19-17 19-32C41 11.507 32.493 3 22 3z"
        fill="#0d2f5c" stroke="#ffffff" stroke-width="2"/>
      <circle cx="22" cy="22" r="16" fill="#8dc0f2"/>
      <circle cx="22" cy="23" r="12" fill="#fdf1e2"/>
      <ellipse cx="17.5" cy="21" rx="1.7" ry="2.3" fill="#0d2f5c"/>
      <ellipse cx="26.5" cy="21" rx="1.7" ry="2.3" fill="#0d2f5c"/>
      <ellipse cx="14.8" cy="26" rx="2.6" ry="1.6" fill="#fbb7ad"/>
      <ellipse cx="29.2" cy="26" rx="2.6" ry="1.6" fill="#fbb7ad"/>
      <path d="M18.5 25.3c1 2.3 2.6 3.4 3.5 3.4s2.5-1.1 3.5-3.4" stroke="#ee6b60" stroke-width="2.3" stroke-linecap="round" fill="none"/>
    </svg>
  </div>`;
}

function syncMarkers(){
  if(!state.map || !state.markerLayer) return;
  state.markerLayer.clearLayers();
  state.markers={};

  const put=(lat,lon,cls,label,onClick,size)=>{
    const html = cls==='pin-pick' ? mascotPinHTML(size) : `<div class="pin ${cls}"></div>`;
    const h = cls==='pin-pick' ? Math.round(size*1.32) : size;
    const m=L.marker([lat,lon],{
      icon:L.divIcon({className:'',html,
        iconSize:[size,h], iconAnchor:[size/2,h-2]})
    }).addTo(state.markerLayer);
    m.bindTooltip(label);
    if(onClick) m.on('click',onClick);
    return m;
  };

  // 출장지를 담았을 때만 사무실(출발·도착지)을 함께 보여줍니다.
  if(state.picked.length) put(CONFIG.office.lat, CONFIG.office.lon, 'pin-office', CONFIG.office.name, null, 28);

  // 해양 탭에서는 담은 장비의 출항 항구도 함께 보여줍니다.
  if(state.tab==='marine'){
    const seen=new Set();
    for(const id of state.picked){
      const s=state.marine.find(x=>x.id===id);
      if(!s || !s.portPt || seen.has(s.port)) continue;
      seen.add(s.port);
      put(s.portPt.lat, s.portPt.lon, 'pin-port', `${s.port} · 출항 항구`, null, 26);
    }
  }

  const pickLabel = state.tab==='marine' ? '점검 대상' : '출장지';
  for(const id of state.picked){
    if(id===state.selected) continue;                 // 선택 핀으로 대신 표시
    const s=items().find(x=>x.id===id);
    if(s && s.valid) state.markers[id]=put(s.lat,s.lon,'pin-pick',`${s.name} · ${pickLabel}`,()=>openSheet(s.id),28);
  }

  const sel=items().find(x=>x.id===state.selected);
  if(sel && sel.valid){
    const picked=state.picked.includes(sel.id);
    state.markers[sel.id]=put(sel.lat,sel.lon,'pin-sel',
      picked?`${sel.name} · ${pickLabel}`:sel.name, ()=>openSheet(sel.id), 34);
  }

  updateMapMascot();
}

/* ========================= 바텀시트 ========================= */
function openSheet(id){
  const s=items().find(x=>x.id===id); if(!s) return;
  const marine=state.tab==='marine';
  // 선택한 장비를 지도에 핀으로 띄우고 그 위치로 옮깁니다.
  state.selected=id;
  syncMarkers();
  if(state.map && s.valid) state.map.setView([s.lat,s.lon], Math.max(state.map.getZoom(), 11), {animate:true});

  const common = `
      <li><b>지점번호</b><span>${esc(s.id)||'-'}</span></li>
      <li><b>마지막 점검</b><span>${fmtDate(s.last)}</span></li>
      <li><b>점검 주기</b><span>${s.cycle?s.cycle+'개월':'-'}</span></li>
      <li><b>다음 점검</b><span class="${s.status.key==='due'?'warn':''}">${fmtDate(s.next)}${
        s.days!==null ? (s.days<0?` (${-s.days}일 경과)`:` (${s.days}일 남음)`) : ''}</span></li>
      <li><b>좌표</b><span>${s.valid?`${s.lat.toFixed(4)}, ${s.lon.toFixed(4)}`:'확인 필요'}</span></li>`;

  let info, subtitle, buttons;
  if(marine){
    subtitle = [s.kind.label, s.seaArea].filter(Boolean).join(' · ') || '해양장비';
    info = `
      <li><b>접근 방식</b><span>${esc(s.access.label)}</span></li>
      ${s.port?`<li><b>출항 항구</b><span>${esc(s.port)}${s.boatMin?` · 편도 약 ${fmtMin(s.boatMin)}`:''}</span></li>`:''}
      ${s.wave?`<li><b>점검 가능 파고</b><span>${s.wave}m 이하</span></li>`:''}
      ${common}
      ${s.vendor?`<li><b>유지보수 업체</b><span>${esc(s.vendor)}${s.vendorTel?` · ${esc(s.vendorTel)}`:''}</span></li>`:''}
      ${s.note?`<li><b>비고</b><span>${esc(s.note)}</span></li>`:''}`;
    // 육상 접근이면 장비까지, 배로 가면 출항 항구까지 길을 안내합니다.
    const target = s.access.key==='land' ? (s.valid?s:null) : s.portPt;
    buttons = `
      ${target?`<a class="btn" href="${navToLink(target)}" target="_blank" rel="noopener">${ICON.nav}
        ${s.access.key==='land'?'길안내 (현위치 출발)':`${esc(s.port||'항구')}까지 길안내`}</a>`:''}
      ${s.photo?`<a class="btn btn-ghost" href="${mediaUrl(CONFIG.photoDir,s.photo)}"
        target="_blank" rel="noopener">${ICON.vr} 장비 사진</a>`:''}`;
  }else{
    subtitle = esc(s.address)||'주소 정보 없음';
    info = `${common}${s.note?`<li><b>비고</b><span>${esc(s.note)}</span></li>`:''}`;
    const navUrl = s.valid ? navToLink(s) : null;
    buttons = `
      ${navUrl?`<a class="btn" href="${navUrl}" target="_blank" rel="noopener">${ICON.nav} 길안내 (현위치 출발)</a>`:''}
      <button class="btn btn-ghost" data-act="pano" data-id="${esc(s.id)}">${ICON.vr} 현장 둘러보기</button>`;
  }

  document.getElementById('sheetBody').innerHTML = `
    <div class="sheet-head">
      <h3 id="sheetName">${esc(s.name)}</h3>
      ${badge(s)}
    </div>
    <p class="sheet-addr">${subtitle}</p>
    <ul class="info">${info}</ul>
    <div class="sheet-btns">${buttons}</div>`;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('dim').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('dim').classList.remove('show');
}

      ? `${state.picked.length}곳 출항 계획 짜기`

function togglePick(id){
  const s=items().find(x=>x.id===id);
  if(!s||!s.valid) return;
  const i=state.picked.indexOf(id);
  if(i>=0) state.picked.splice(i,1);
  else{
    if(state.picked.length>=CONFIG.maxPick){
      alert(`한 번에 최대 ${CONFIG.maxPick}곳까지 담을 수 있습니다.`);
      return;
    }
    state.picked.push(id);
  }
  renderTags(); renderList(); syncMarkers(); updateWaveWorst();
  document.getElementById('routeResult').classList.remove('show');
}

/* 지점 간 거리·소요시간 표를 만듭니다.
   provider가 'osrm'이면 도로 기준, 실패하거나 'straight'면 직선 기준으로 돌아갑니다. */
function straightMatrix(pts){
  const n=pts.length, dist=[], dur=[];
  for(let i=0;i<n;i++){
    dist.push([]); dur.push([]);
    for(let j=0;j<n;j++){ dist[i].push(distKm(pts[i],pts[j])); dur[i].push(null); }
  }
  return {dist,dur,mode:'straight'};
}

async function roadMatrix(pts){
  if(CONFIG.routing.provider!=='osrm') return straightMatrix(pts);
  const coords=pts.map(p=>`${p.lon},${p.lat}`).join(';');
  const url=`${CONFIG.routing.osrmBase}/table/v1/driving/${coords}?annotations=distance,duration`;
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(), CONFIG.routing.timeoutMs);
  try{
    const res=await fetch(url,{signal:ctl.signal});
    if(!res.ok) throw new Error('경로 서버 응답 '+res.status);
    const j=await res.json();
    if(j.code!=='Ok'||!Array.isArray(j.distances)) throw new Error(j.code||'응답 형식이 예상과 다릅니다');
    return {
      // 미터 → km, 초 → 분. 도로로 이어지지 않는 구간은 null로 옵니다(섬 등).
      dist: j.distances.map(r=>r.map(m=> m==null?null:m/1000)),
      dur:  (j.durations||[]).map(r=>r.map(s=> s==null?null:s/60)),
      mode: 'road'
    };
  }catch(err){
    const f=straightMatrix(pts);
    f.error = err.name==='AbortError' ? '경로 서버 응답이 없습니다(시간 초과)' : (err.message||String(err));
    return f;
  }finally{
    clearTimeout(timer);
  }
}

/* 한 구간의 거리·시간.
   도로값이 없으면 직선거리로 대체하고, 시간은 평균 시속으로 추정합니다(road:false). */
function legInfo(m,pts,i,j){
  const km=m.dist[i]?.[j];
  const min=m.dur[i]?.[j];
  if(m.mode==='road' && km!=null && min!=null) return {km, min, road:true};
  const straightKm = (m.mode==='road' && km!=null) ? km : distKm(pts[i],pts[j]);
  return {km: straightKm, min: straightKm/CONFIG.routing.avgKmh*60, road:false};
}

/* 사무실(0번) 출발 → 선택 장비 전부 → 사무실 복귀.
   거리표를 미리 만들어 두고 최단 순서를 완전탐색으로 찾습니다(최대 8곳). */
function bestRoute(m,pts){
  const stops=pts.map((_,i)=>i).slice(1);
  let best=null;
  const perm=(arr,cur)=>{
    if(!arr.length){
      const seq=[...cur,0];
      let total=0, prev=0;
      const legs=[];
      for(const k of seq){ const L=legInfo(m,pts,prev,k); legs.push({from:prev,to:k,...L}); total+=L.km; prev=k; }
      if(!best||total<best.total) best={legs,total};
      return;
    }
    for(let i=0;i<arr.length;i++) perm(arr.slice(0,i).concat(arr.slice(i+1)), cur.concat(arr[i]));
  };
  perm(stops,[]);
  return best;
}

/* 길찾기에 넘길 검색어 — 주소로 찾는 지도앱(카카오)에서 씁니다.
   괄호 안 부연설명과 쉼표 뒤 지번은 검색을 방해해서 떼어냅니다.
   예) '전라남도 목포시 고하대로 815 (목포시 연산동 726-3 목포기상대)'
       → '전라남도 목포시 고하대로 815' */
function navQuery(p){
  const addr=(p.address||'').replace(/\([^)]*\)/g,' ').split(',')[0].replace(/\s+/g,' ').trim();
  return addr || p.name;
}

/* 길안내 링크 — 출발지·도착지를 모두 지정해 지도앱 길찾기를 엽니다.
   지도앱을 바꾸려면 CONFIG.navProvider 한 줄만 고치면 됩니다.

   네이버지도는 위경도를 그대로 받아 검색 과정이 없습니다. 주소가 조금 부정확해도
   정확한 지점으로 열리므로 기본값으로 씁니다.
   카카오맵은 출발·도착 좌표를 함께 넘기는 공개 형식이 없어 주소 검색에 의존하며,
   도착지를 무시하는 경우가 있습니다. */
const NAV_LINK = {
  // 네이버지도 자동차 길찾기 — 경도,위도,이름 순서
  naver: (f,t) =>
    `https://map.naver.com/p/directions/`
    + `${f.lon},${f.lat},${encodeURIComponent(f.name)},,/`
    + `${t.lon},${t.lat},${encodeURIComponent(t.name)},,/-/car`,
  // 카카오맵 길찾기 — 출발지/도착지를 주소로 검색
  kakao: (f,t) =>
    `https://map.kakao.com/?sName=${encodeURIComponent(navQuery(f))}`
    + `&eName=${encodeURIComponent(navQuery(t))}`
};
function navLink(from,to){
  return (NAV_LINK[CONFIG.navProvider] || NAV_LINK.naver)(from,to);
}

// 상세 카드용 — 출발지 없이 도착지만 지정합니다(현위치 출발).
const NAV_TO = {
  naver: t => `https://map.naver.com/p/directions/-/${t.lon},${t.lat},`
            + `${encodeURIComponent(t.name)},,/-/car`,
  kakao: t => `https://map.kakao.com/link/to/${encodeURIComponent(t.name)},${t.lat},${t.lon}`
};
function navToLink(to){
  return (NAV_TO[CONFIG.navProvider] || NAV_TO.naver)(to);
}

function legRow(m,pts,leg){
  const from=pts[leg.from], to=pts[leg.to];
  const time=fmtMin(leg.min);
  const label = leg.road
    ? `도로 약 ${fmtKm(leg.km)}km · 약 ${time}`
    : `직선 약 ${fmtKm(leg.km)}km · 예상 ${time}`;
  return `<div class="leg">
    <span class="leg-path">${esc(from.name)} <b>→</b> ${esc(to.name)}</span>
    <span class="leg-dist${leg.road?'':' straight'}">${label}</span>
    <a class="leg-nav" href="${navLink(from,to)}" target="_blank" rel="noopener">${ICON.nav} 길안내</a>
    ${(m.mode==='road'&&!leg.road)
      ? `<span class="leg-warn">도로 경로를 찾지 못했습니다 (섬·선박 구간일 수 있습니다)</span>` : ''}
  </div>`;
}

/* 해양 — 출항 항구별로 묶어 하루 일정을 만듭니다.
   사무실→항구는 도로 기준, 항구→장비는 CSV의 항해 시간을 씁니다. */
async function calcSailing(){
  const list=state.picked.map(id=>state.marine.find(x=>x.id===id)).filter(Boolean);
  if(!list.length) return;
  const box=document.getElementById('routeResult');
  const btn=document.getElementById('calcBtn');
  box.innerHTML=`<div class="route-loading">항구까지 도로 경로를 계산하는 중입니다…</div>`;
  box.classList.add('show');
  btn.disabled=true;

  // 업체 점검 장비는 일정에서 빼고 따로 알립니다.
  const byVendor=list.filter(s=>s.access.key==='vendor');
  const mine=list.filter(s=>s.access.key!=='vendor');

  // 출항 항구(또는 '육상 접근')별로 묶습니다.
  const groups=new Map();
  for(const s of mine){
    if(!groups.has(s.group)) groups.set(s.group,{name:s.groupLabel, items:[], start:null, boat:s.access.key==='boat'});
    const g=groups.get(s.group);
    g.items.push(s);
    // 육상 접근은 장비 자체가, 선박은 항구가 육상 목적지입니다.
    if(!g.start) g.start = s.access.key==='boat' ? s.portPt : (s.valid?s:null);
  }

  // 사무실 → 각 그룹 육상 목적지까지 한 번에 계산
  const starts=[...groups.values()].map(g=>g.start).filter(Boolean);
  const pts=[CONFIG.office, ...starts];
  const m=starts.length ? await roadMatrix(pts) : {mode:'straight',dist:[[0]],dur:[[null]]};

  btn.disabled=false; renderTags();

  let idx=0, totalMin=0, totalKm=0;
  const cards=[...groups.values()].map(g=>{
    let drive=null;
    if(g.start){
      idx++;
      drive=legInfo(m,pts,0,idx);
      totalKm+=drive.km*2;                       // 왕복
      totalMin+=drive.min*2;
    }
    const sail=g.items.reduce((a,s)=>a+(s.boatMin||0),0)*2;   // 왕복 항해
    totalMin+=sail;
    const waves=g.items.map(s=>s.wave).filter(w=>w!=null);

    return `<div class="port-card">
      <div class="port-head">
        <b>${esc(g.name)}</b>
        <span class="port-cnt">${g.items.length}곳</span>
      </div>
      ${g.start?`<div class="leg">
        <span class="leg-path">${esc(CONFIG.office.name)} <b>→</b> ${esc(g.start.name)}</span>
        <span class="leg-dist${drive.road?'':' straight'}">${drive.road?'도로':'직선'} 약 ${fmtKm(drive.km)}km
          · ${drive.road?'약':'예상'} ${fmtMin(drive.min)}</span>
        <a class="leg-nav" href="${navLink(CONFIG.office,g.start)}" target="_blank" rel="noopener">${ICON.nav} 길안내</a>
      </div>`:`<div class="leg"><span class="leg-warn">항구 좌표가 없어 육상 경로를 계산하지 못했습니다.</span></div>`}
      <ul class="port-list">
        ${g.items.map(s=>`<li>
          <button class="step-link" data-act="open" data-id="${esc(s.id)}">
            <span class="step-name">${esc(s.name)}</span>${badge(s)}<span class="step-more">현황 보기</span>
          </button>
          <span class="port-meta">${esc(s.kind.label)}${
            s.boatMin?` · 편도 항해 약 ${fmtMin(s.boatMin)}`:' · 항해 시간 미입력'}${
            s.wave?` · 파고 ${s.wave}m 이하`:''}</span>
        </li>`).join('')}
      </ul>
      <div class="port-foot">
        ${g.boat?`왕복 항해 약 ${fmtMin(sail)}`:'차로 가서 걸어서 접근'}
        ${g.boat&&waves.length?` · 출항 조건 <b>파고 ${Math.min(...waves)}m 이하</b>`:''}
      </div>
    </div>`;
  }).join('');

  box.innerHTML = `
    ${m.error?`<div class="route-warn">항구까지 도로 거리를 가져오지 못해 <b>직선거리</b>로 계산했습니다. (${esc(m.error)})</div>`:''}
    <div class="route-total">
      ${mascotRowHTML(totalKm)}
      <div class="route-sum"><span>육상 이동거리 (왕복)</span><b>약 ${fmtKm(totalKm)} km</b></div>
      <div class="route-sum"><span>총 소요시간</span><b>예상 ${fmtMin(totalMin)}</b></div>
      <em>육상 왕복 + 항해 왕복 합계입니다. <b>점검 작업 시간과 대기 시간은 빠져 있습니다.</b></em>
    </div>
    ${restTipHTML(totalKm)}
    ${cards}
    ${byVendor.length?`<div class="route-warn">
      <b>업체 점검 장비 ${byVendor.length}곳</b>은 일정에서 제외했습니다 —
      ${byVendor.map(s=>esc(s.name)).join(', ')}</div>`:''}`;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function calcRoute(){
  if(state.tab==='marine') return calcSailing();
  const list=state.picked.map(id=>state.stations.find(x=>x.id===id)).filter(Boolean);
  if(!list.length) return;
  const box=document.getElementById('routeResult');
  const btn=document.getElementById('calcBtn');

  box.innerHTML=`<div class="route-loading">도로 경로를 계산하는 중입니다…</div>`;
  box.classList.add('show');
  btn.disabled=true;

  const pts=[CONFIG.office, ...list];
  const m=await roadMatrix(pts);
  const r=bestRoute(m,pts);

  btn.disabled=false;
  renderTags();

  const allRoad = r.legs.every(l=>l.road);
  const basis = allRoad ? '도로 기준'
              : m.mode==='road' ? `도로 기준 · 일부 구간은 직선거리와 평균 시속 ${CONFIG.routing.avgKmh}km 추정`
              : `직선거리와 평균 시속 ${CONFIG.routing.avgKmh}km 추정`;
  const totalMin = r.legs.reduce((a,l)=>a+l.min,0);

  const steps=[
    `<li class="step"><span class="step-no office">출</span><div class="step-body">
       <div class="step-name">${esc(CONFIG.office.name)}</div>
       <div class="step-meta">출발</div></div></li>`,
    ...r.legs.slice(0,-1).map((leg,i)=>{
      const s=pts[leg.to];
      return `<li class="step"><span class="step-no">${i+1}</span><div class="step-body">
        <button class="step-link" data-act="open" data-id="${esc(s.id)}">
          <span class="step-name">${esc(s.name)}</span>${badge(s)}<span class="step-more">현황 보기</span>
        </button>
        <div class="step-meta">${esc(s.address)||'주소 정보 없음'}</div>
        ${legRow(m,pts,leg)}</div></li>`;
    }),
    (()=>{ const back=r.legs[r.legs.length-1];
      return `<li class="step"><span class="step-no office">복</span><div class="step-body">
        <div class="step-name">${esc(CONFIG.office.name)}</div>
        <div class="step-meta">복귀</div>
        ${legRow(m,pts,back)}</div></li>`; })()
  ].join('');

  box.innerHTML = `
    ${m.error?`<div class="route-warn">도로 거리를 가져오지 못해 <b>직선거리</b>로 계산했습니다. (${esc(m.error)})</div>`:''}
    <div class="route-total">
      ${mascotRowHTML(r.total)}
      <div class="route-sum">
        <span>총 이동거리</span><b>약 ${fmtKm(r.total)} km</b>
      </div>
      <div class="route-sum">
        <span>총 소요시간</span><b>${allRoad?'약':'예상'} ${fmtMin(totalMin)}</b>
      </div>
      <em>${basis} · 실시간 교통 상황은 반영되지 않습니다</em>
    </div>
    ${restTipHTML(r.total)}
    <ul class="steps">${steps}</ul>`;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 사진 주소 만들기 —
   CSV에 파일명만 적으면 저장소 폴더에서, http로 시작하는 주소를 적으면 그 주소에서 가져옵니다.
   사진이 많아 저장소에 담기 어려우면 별도 서버에 두고 주소를 적으면 됩니다. */
function mediaUrl(dir, value){
  const v=(value||'').trim();
  return /^https?:\/\//i.test(v) ? v : dir+encodeURIComponent(v);
}

/* ========================= ⑤ 파노라마 ========================= */
function renderPano(s){
  const wrap=document.getElementById('panoWrap');
  const pick=document.getElementById('panoPick');
  pick.innerHTML = `선택된 장비: <b>${s?esc(s.name):'없음'}</b>`;

  if(!s || !s.panorama){
    wrap.innerHTML = `<div class="pano-empty">
      ${ICON.vr}
      <b>${s?'촬영 예정입니다':'장비를 선택해 주세요'}</b>
      <span>${s?'이 장비는 아직 파노라마 사진이 등록되지 않았습니다.':'장비 상세에서 “현장 둘러보기”를 누르면 여기에 표시됩니다.'}</span>
    </div>`;
    return;
  }
  const src=mediaUrl(CONFIG.panoDir, s.panorama);
  wrap.innerHTML = `<div class="pano" id="pano"><div class="pano-hint" id="panoHint">← 좌우로 드래그해서 둘러보세요 →</div></div>`;
  const el=document.getElementById('pano');
  const img=new Image();
  img.onload=()=>setupPano(el, src);
  /* 아직 촬영·등록되지 않은 지점이 대부분이라, 못 불러온 것을 오류처럼 보이지 않게 적습니다.
     주소는 함께 보여줘서 실제로 잘못된 경우 확인할 수 있게 했습니다. */
  img.onerror=()=>{ wrap.innerHTML=`<div class="pano-empty">${ICON.vr}
    <b>아직 등록된 사진이 없습니다</b>
    <span>사진을 올렸는데도 보이지 않으면 주소를 확인해 주세요.<br>
      <code style="font-size:11.5px;opacity:.75">${esc(src)}</code></span></div>`; };
  img.src=src;
}

function setupPano(el, src){
  const ZOOM=2.0;                       // 화면 높이 대비 사진 확대 배율
  const H=el.clientHeight;
  const imgH=H*ZOOM, imgW=imgH*2;       // equirectangular 2:1
  let x=-imgW*0.25, y=(H-imgH)/2;
  el.style.backgroundImage=`url("${src}")`;
  el.style.backgroundSize=`${imgW}px ${imgH}px`;
  const apply=()=>{
    x=((x%imgW)+imgW)%imgW-imgW;        // 좌우 무한 반복
    y=Math.max(H-imgH, Math.min(0,y));
    el.style.backgroundPosition=`${x}px ${y}px`;
  };
  apply();

  let drag=false, sx=0, sy=0, ox=0, oy=0, moved=false;
  const down=e=>{ drag=true; moved=false; el.classList.add('dragging');
    const p=pt(e); sx=p.x; sy=p.y; ox=x; oy=y; };
  const move=e=>{ if(!drag) return; const p=pt(e);
    if(Math.abs(p.x-sx)>4){ moved=true; if(e.cancelable) e.preventDefault(); }
    x=ox+(p.x-sx); y=oy+(p.y-sy); apply();
    if(moved){ const h=document.getElementById('panoHint'); if(h) h.style.display='none'; } };
  const up=()=>{ drag=false; el.classList.remove('dragging'); };
  const pt=e=>e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};

  el.addEventListener('mousedown',down); el.addEventListener('touchstart',down,{passive:true});
  window.addEventListener('mousemove',move); el.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); el.addEventListener('touchend',up);
}

/* ========================= 이벤트 ========================= */
function bindEvents(){
  // 검색어 입력 — 입력이 있으면 목록을 자동으로 펼칩니다.
  document.getElementById('q').addEventListener('input',e=>{
    state.query=e.target.value;
    renderList();
    if(state.query.trim()) setListOpen(true);
  });

  // 검색 방식 (전체 / 주소 / 관측장비번호)
  document.getElementById('modes').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    state.mode=b.dataset.m;
    [...document.querySelectorAll('#modes .chip')].forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
    const q=document.getElementById('q');
    q.placeholder=MODE_PLACEHOLDER[state.tab][state.mode];
    q.focus();
    renderList();
    if(state.query.trim()) setListOpen(true);
  });

  // 상태 필터
  document.getElementById('chips').addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    state.filter=b.dataset.f;
    [...document.querySelectorAll('#chips .chip')].forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
    renderList();
  });

  // 종류 필터 (해양 탭에만 있습니다)
  const kinds=document.getElementById('kinds');
  if(kinds) kinds.addEventListener('click',e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    state.kind=b.dataset.k;
    [...kinds.querySelectorAll('.chip')].forEach(c=>c.setAttribute('aria-pressed', String(c===b)));
    renderList();
  });

  // 목록 접기/펴기
  document.getElementById('listToggle').addEventListener('click',()=>setListOpen(!state.listOpen));

  // 지도 전체 보기 — 핀이 올라와 있으면 그 핀들에, 없으면 광주·전남 전체에 맞춥니다.
  document.getElementById('fitBtn').addEventListener('click',()=>{
    if(!state.map) return;
    const shown=Object.values(state.markers).map(m=>m.getLatLng());
    if(state.picked.length) shown.push(L.latLng(CONFIG.office.lat,CONFIG.office.lon));
    if(shown.length>1) state.map.fitBounds(L.latLngBounds(shown).pad(0.25));
    else if(shown.length===1) state.map.setView(shown[0],12);
    else if(state.bounds) state.map.fitBounds(state.bounds);
  });

  document.getElementById('list').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='open') openSheet(b.dataset.id);
    if(b.dataset.act==='pick') togglePick(b.dataset.id);
  });

  document.getElementById('tags').addEventListener('click',e=>{
    const b=e.target.closest('[data-act="unpick"]'); if(b) togglePick(b.dataset.id);
  });

  // 경로의 방문지를 누르면 그 장비 현황(상세 카드)이 열립니다.
  document.getElementById('routeResult').addEventListener('click',e=>{
    const b=e.target.closest('[data-act="open"]'); if(b) openSheet(b.dataset.id);
  });

  document.getElementById('calcBtn').addEventListener('click',calcRoute);
  renderTags();
}

/* 지상 ↔ 해양 전환 — 담아 둔 목록과 검색어는 탭마다 뜻이 달라 초기화합니다. */
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b || !b.dataset.tab || b.dataset.tab===state.tab) return;
  state.tab=b.dataset.tab;
  [...document.querySelectorAll('#tabs .tab')].forEach(t=>t.setAttribute('aria-pressed', String(t===b)));
  Object.assign(state,{ filter:'all', kind:'all', query:'', mode:'all', listOpen:false,
                        picked:[], selected:null, markerLayer:null, markers:{}, bounds:null });
  closeSheet();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('dim').addEventListener('click',closeSheet);
document.getElementById('sheetClose').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
document.getElementById('sheetBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-act="pano"]'); if(!b) return;
  const s=state.stations.find(x=>x.id===b.dataset.id);
  closeSheet();
  renderPano(s);
  setTimeout(()=>document.getElementById('panoSec').scrollIntoView({behavior:'smooth',block:'start'}),150);
});

/* ========================= 시작 ========================= */
function showBanner(html){
  const b=document.getElementById('banner');
  b.innerHTML=html; b.classList.add('show');
}

async function start(){
  let text=null, fromFile=false, mtime=null;
  try{
    const res=await fetch(CONFIG.csvPath,{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    text=await res.text();
    fromFile=true;
    mtime=res.headers.get('last-modified');
  }catch(err){
    text=FALLBACK_CSV;
    showBanner(`⚠️ <b>내장 사본 데이터로 표시 중입니다.</b><br>
      파일을 직접 열면 브라우저 보안 정책상 <code>data/stations.csv</code>를 읽을 수 없습니다.
      실제 데이터를 보려면 이 폴더에서 <code>python3 -m http.server 8000</code> 실행 후
      <code>localhost:8000</code>으로 접속하세요.`);
  }

  const rows=parseCSV(text);
  state.stations=rows.map(buildStation).filter(s=>s.id||s.name!=='(이름 없음)');

  // 해양장비 — 파일이 없어도 지상 화면은 그대로 동작합니다.
  try{
    const res=await fetch(CONFIG.marineCsvPath,{cache:'no-store'});
    if(res.ok){
      state.marine=parseCSV(await res.text()).map(buildMarine)
        .filter(s=>s.id||s.name!=='(이름 없음)');
      state.marineLoaded=true;
    }
  }catch(err){ /* 해양 탭에서 안내 문구로 알립니다 */ }

  if(!state.stations.length){
    document.getElementById('app').innerHTML=`<div class="empty" style="padding:60px 20px">
      장비 데이터를 읽지 못했습니다.<br>data/stations.csv 파일을 확인해 주세요.</div>`;
    return;
  }

  const base = fromFile && mtime ? new Date(mtime) : null;
  document.getElementById('dataBase').textContent =
    (base ? fmtDate(base) : fmtDate(today0())) + (fromFile ? ' (CSV 기준)' : ' (내장 사본)');

  render();
}
start();
</script>
