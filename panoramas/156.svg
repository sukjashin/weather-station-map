<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="2048" viewBox="0 0 4096 2048">
  <!-- 샘플 파노라마 (실제 촬영본 대체용 데모 이미지) -->
  <!-- 실제 촬영본은 equirectangular JPG, 가로:세로 = 2:1, 가로 4096px 이상 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f5f97"/>
      <stop offset="55%" stop-color="#7fadd6"/>
      <stop offset="100%" stop-color="#d8e8f4"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f9060"/>
      <stop offset="100%" stop-color="#3f4a30"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa6bd"/>
      <stop offset="100%" stop-color="#b9cbdb"/>
    </linearGradient>
  </defs>

  <rect width="4096" height="1180" fill="url(#sky)"/>
  <rect y="1180" width="4096" height="868" fill="url(#ground)"/>

  <circle cx="3180" cy="380" r="110" fill="#fdf3cf" opacity="0.9"/>
  <ellipse cx="760" cy="330" rx="300" ry="72" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="980" cy="360" rx="220" ry="58" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="2350" cy="270" rx="360" ry="80" fill="#ffffff" opacity="0.4"/>

  <!-- 원경 산능선 (좌우 끝이 이어지도록 동일 높이에서 시작·종료) -->
  <path d="M0,1180 L0,1050 L240,930 L470,1035 L720,880 L980,1010 L1230,905 L1500,1000 L1760,860 L2020,995 L2300,915 L2560,1030 L2820,900 L3080,1005 L3340,925 L3600,1020 L3860,950 L4096,1050 L4096,1180 Z" fill="url(#far)"/>

  <!-- 관측노장 울타리 -->
  <g stroke="#e8e8e0" stroke-width="7" opacity="0.85">
    <line x1="1500" y1="1300" x2="1500" y2="1180"/>
    <line x1="1660" y1="1310" x2="1660" y2="1185"/>
    <line x1="1820" y1="1320" x2="1820" y2="1190"/>
    <line x1="1980" y1="1325" x2="1980" y2="1192"/>
    <line x1="2140" y1="1320" x2="2140" y2="1190"/>
    <line x1="2300" y1="1310" x2="2300" y2="1185"/>
    <line x1="2460" y1="1300" x2="2460" y2="1180"/>
    <path d="M1500,1210 L2460,1210" fill="none"/>
    <path d="M1500,1290 L2460,1290" fill="none"/>
  </g>

  <!-- AWS 관측탑 -->
  <g>
    <rect x="1955" y="700" width="26" height="500" fill="#dfe4e6"/>
    <rect x="1900" y="1195" width="140" height="26" rx="6" fill="#c3cacd"/>
    <path d="M1968,700 L1900,660 L1968,676 L2036,660 Z" fill="#c9d0d3"/>
    <circle cx="1968" cy="648" r="18" fill="#eef1f2"/>
    <rect x="1868" y="880" width="96" height="60" rx="8" fill="#e6eaec"/>
    <rect x="1990" y="980" width="70" height="46" rx="6" fill="#e6eaec"/>
  </g>

  <!-- 근경 수목 -->
  <g fill="#2f4526">
    <ellipse cx="300" cy="1230" rx="170" ry="120"/>
    <rect x="285" y="1230" width="30" height="120" fill="#4a3a26"/>
    <ellipse cx="640" cy="1265" rx="130" ry="95"/>
    <rect x="628" y="1265" width="26" height="100" fill="#4a3a26"/>
    <ellipse cx="3080" cy="1215" rx="200" ry="140"/>
    <rect x="3062" y="1215" width="34" height="140" fill="#4a3a26"/>
    <ellipse cx="3480" cy="1270" rx="145" ry="100"/>
    <rect x="3468" y="1270" width="28" height="110" fill="#4a3a26"/>
    <ellipse cx="3900" cy="1245" rx="160" ry="110"/>
    <rect x="3886" y="1245" width="30" height="120" fill="#4a3a26"/>
  </g>

  <!-- 관리동 건물 -->
  <g>
    <rect x="2760" y="1010" width="300" height="200" fill="#cfd6d9"/>
    <path d="M2740,1010 L2910,930 L3080,1010 Z" fill="#8d9ba1"/>
    <rect x="2810" y="1070" width="60" height="60" fill="#6f8695"/>
    <rect x="2950" y="1070" width="60" height="60" fill="#6f8695"/>
  </g>

  <!-- 지면 질감 -->
  <g stroke="#55643f" stroke-width="10" opacity="0.5">
    <path d="M0,1420 Q1024,1470 2048,1420 T4096,1420" fill="none"/>
    <path d="M0,1650 Q1024,1590 2048,1650 T4096,1650" fill="none"/>
    <path d="M0,1880 Q1024,1940 2048,1880 T4096,1880" fill="none"/>
  </g>

  <text x="2048" y="1990" font-family="sans-serif" font-size="46" fill="#e9eee7" opacity="0.75" text-anchor="middle">샘플 파노라마 — 실제 촬영본으로 교체 예정</text>
</svg>
